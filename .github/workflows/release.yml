name: Curio release

# Publishes a GitHub release with the Nextcloud app archive (curio-X.Y.Z.tar.gz,
# top folder "curio/") ready for the App Store. Runs when a tag like v2.0.0 is
# pushed, or when a push changes the version in appinfo/info.xml; then the tag
# vX.Y.Z is created on that commit. A version that already has a release is
# left alone.

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    paths:
      - 'appinfo/info.xml'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xml=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml | head -1)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            [ "$v" = "$xml" ] || { echo "Tag $GITHUB_REF_NAME but appinfo/info.xml says $xml"; exit 1; }
          else
            v="$xml"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Validate appinfo/info.xml against the App Store schema
        run: |
          command -v xmllint >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils; }
          curl -sSfL -o info.xsd https://raw.githubusercontent.com/nextcloud/appstore/master/nextcloudappstore/api/v1/release/info.xsd
          xmllint --noout --schema info.xsd appinfo/info.xml

      - name: Package the app
        if: env.SKIP != '1'
        run: |
          mkdir -p dist/curio
          git archive HEAD appinfo img js l10n lib templates src CHANGELOG.md COPYING README.md package.json package-lock.json webpack.config.js | tar -x -C dist/curio
          tar -C dist -czf "curio-$VERSION.tar.gz" curio
          tar -tzf "curio-$VERSION.tar.gz" | head -20
          sha256sum "curio-$VERSION.tar.gz"

      - name: Release notes from CHANGELOG.md
        if: env.SKIP != '1'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Curio $VERSION" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        if: env.SKIP != '1'
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Curio v${{ env.VERSION }}
          body_path: notes.md
          files: curio-${{ env.VERSION }}.tar.gz
          make_latest: true
