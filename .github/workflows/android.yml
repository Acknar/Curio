name: Android APK

on:
  push:
    # Listing tags alone would limit the trigger to tag pushes; branches must be named too.
    branches:
      - '**'
    paths:
      - 'android/**'
      - 'src/styles.css'
      - 'l10n/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test clipper scripts
        working-directory: android/tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without release secrets the APK is signed with a debug key. Caching that key
      # keeps the signature stable between runs, so a new APK installs over the old one.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: curio-debug-keystore-v1

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CURIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/curio.keystore"
            echo "CURIO_KEYSTORE_FILE=$RUNNER_TEMP/curio.keystore" >> "$GITHUB_ENV"
            echo "Release key found."
          else
            echo "No CURIO_KEYSTORE_BASE64 secret: signing with the cached debug key."
          fi

      - name: Build APK
        working-directory: android
        env:
          CURIO_KEYSTORE_PASSWORD: ${{ secrets.CURIO_KEYSTORE_PASSWORD }}
          CURIO_KEY_ALIAS: ${{ secrets.CURIO_KEY_ALIAS }}
          CURIO_KEY_PASSWORD: ${{ secrets.CURIO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: curio-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
