<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		html, body { margin: 0; height: 100%; font-family: system-ui, Roboto, sans-serif; background: #f5f6f8; color: #1a1a1a; }
		@media (prefers-color-scheme: dark) { html, body { background: #121417; color: #eceef1; } }
		.box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 14px; }
		p { margin: 0; color: #8a929d; max-width: 320px; line-height: 1.5; }
		button { border: 1px solid #0069c2; background: #0069c2; color: #fff; border-radius: 8px; padding: 10px 18px; font: inherit; font-weight: 600; }
	</style>
</head>
<body>
	<div class="box">
		<svg width="44" height="44" viewBox="0 0 256 256" fill="#0069c2"><rect x="25" y="25" width="96" height="124" rx="18"/><rect x="25" y="163" width="96" height="68" rx="18"/><rect x="135" y="25" width="96" height="68" rx="18"/><rect x="135" y="107" width="96" height="124" rx="18"/></svg>
		<p id="msg">Your Nextcloud cannot be reached. Check your connection.</p>
		<button id="retry">Retry</button>
	</div>
	<script>
		var T = {
			fr: ['Votre Nextcloud est injoignable. Vérifiez votre connexion.', 'Réessayer'],
			es: ['No se puede acceder a tu Nextcloud. Revisa tu conexión.', 'Reintentar'],
			de: ['Ihre Nextcloud ist nicht erreichbar. Prüfen Sie Ihre Verbindung.', 'Erneut versuchen'],
			it: ['Il tuo Nextcloud non è raggiungibile. Controlla la connessione.', 'Riprova'],
			pt: ['Não é possível aceder ao seu Nextcloud. Verifique a ligação.', 'Tentar novamente'],
			nl: ['Je Nextcloud is niet bereikbaar. Controleer je verbinding.', 'Opnieuw proberen'],
		};
		var t = T[(navigator.language || 'en').toLowerCase().split(/[-_]/)[0]];
		if (t) { document.getElementById('msg').textContent = t[0]; document.getElementById('retry').textContent = t[1]; }
		document.getElementById('retry').addEventListener('click', function () { window.CurioAndroid && CurioAndroid.retry(); });
	</script>
</body>
</html>
