<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Add reference</title>
	<link rel="stylesheet" href="../curio/styles.css">
	<link rel="stylesheet" href="app.css">
</head>
<body>
	<!-- Curio's own "Add reference" dialog, fed by the share menu. -->
	<div class="curio sheet" id="root">
		<div class="scrim show" id="scrim">
			<div class="modal show" id="modal">
				<div class="mhead"><h2 data-tr="Add reference">Add reference</h2><button class="close" id="btnClose" data-icon="x"></button></div>
				<div class="mbody">
					<!-- Not connected yet -->
					<div id="setup" class="hidden">
						<p id="setupMsg" style="margin:0 0 14px"></p>
						<button type="button" id="btnConnect" class="btn primary block" data-tr="Open Curio">Open Curio</button>
					</div>

					<div id="form" autocomplete="off">
						<div id="notes"></div>

						<div class="fetchprev loading" id="prevRow">
							<div class="fetchprev-img" id="prevBox"><img id="prevImg" alt=""></div>
							<span class="fetchmsg" id="fetchMsg"></span>
						</div>
						<label class="dropzone filebox hidden" id="fileBox"><span id="fileIcon"></span><span id="fileName"></span></label>
						<div class="imgpick hidden" id="imgPick">
							<div class="imgpick-lbl" data-tr="Choose the image to import:">Choose the image to import:</div>
							<div class="imgpick-row" id="imgPickRow"></div>
						</div>

						<div class="field"><label data-tr="Board">Board</label>
							<select id="board" class="rb-select"></select>
						</div>
						<div class="field"><label data-tr="Title">Title</label><input id="title" data-tr-placeholder="Title (optional)"></div>
						<div class="field" id="descField"><label data-tr="Description">Description</label><textarea id="desc" data-tr-placeholder="Optional description"></textarea></div>
						<div class="field hidden" id="bodyField"><label data-tr="Text">Text</label><textarea id="body" style="min-height:140px" data-tr-placeholder="Write markdown..."></textarea></div>

						<div class="field" id="locField"><label data-tr="Location">Location</label>
							<div id="geoDetected" class="geo-detected hidden"><span data-icon="pin" data-size="14"></span> <span id="geoDetectedTxt" class="geo-detected-txt"></span><button class="geo-detected-x" id="geoClear" data-icon="x" data-size="13"></button></div>
							<div class="geo-search addgeo-search taginput-wrap">
								<input id="geoQuery" data-tr-placeholder="Search a place or address...">
								<div id="geoSug" class="tagsug geo-sug hidden"></div>
							</div>
							<div id="geoBusy" class="hashsug hidden" style="margin-top:6px"><span class="hashsug-lbl" data-tr="Detecting location…">Detecting location…</span></div>
							<div id="geoSuggestions" class="hashsug hidden" style="margin-top:6px"></div>
						</div>

						<div class="field"><label data-tr="Tags">Tags</label>
							<div class="taginput-wrap">
								<div class="taginput" id="tagPills"><input id="tagInput" data-tr-placeholder="Add tags, Enter..." enterkeyhint="done"></div>
								<div id="tagSug" class="tagsug hidden"></div>
							</div>
							<div id="hashSug" class="hashsug hidden"><span class="hashsug-lbl" data-tr="From caption:">From caption:</span></div>
						</div>

						<div id="err" class="setup-err hidden" style="margin:0 0 6px"></div>
					</div>
				</div>
				<div class="mfoot" id="foot">
					<button class="btn" id="btnCancel" data-tr="Cancel">Cancel</button>
					<button class="btn primary" id="btnAdd" disabled data-tr="Add to board">Add to board</button>
				</div>
			</div>
		</div>
		<div class="toasts" id="toasts"></div>
	</div>

	<script src="native.js"></script>
	<script src="app-l10n.js"></script>
	<script src="look.js"></script>
	<script src="curio.js"></script>
	<script src="taglogic.js"></script>
	<script src="cleanup.js"></script>
	<script src="extract.js"></script>
	<script src="clip.js"></script>
</body>
</html>
